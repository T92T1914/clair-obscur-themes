name: Theme checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Deploy the checked preview from main to GitHub Pages
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Main publication runs replace obsolete work. Check-only manual runs cannot
# cancel publication. Tag runs retain the separate release job's queue.
concurrency:
  group: theme-checks-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && !inputs.publish_pages && '-check-only' || '' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Unit and packaging checks
        run: python -m unittest discover -s tests -v
      - name: Build reviewed theme artifacts
        run: python build.py
      - name: Verify reproducible output
        run: python build.py --check
      - name: Build static download specimen
        run: python preview.py --expected-revision "${{ github.sha }}"
      - name: Retain the checked preview and downloads
        if: matrix.os == 'ubuntu-26.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clair-obscur-preview
          path: outputs/preview/
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Packaged Chrome has Ubuntu's existing sandbox policy; cached Chromium does not.
      - name: Record installed Google Chrome version
        run: google-chrome --version
      - name: Headless specimen checks
        run: npm run test:browser
        env:
          THEME_BROWSER_CHANNEL: chrome

  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: theme-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clair-obscur-preview
          path: site
      - name: Check release version, notes and download inventory
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re

          version = json.loads(Path('tokens.json').read_text(encoding='utf-8'))['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('The release version must contain three numeric components')
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('The tag must match the version in tokens.json')
          notes = Path('docs/releases') / f'{version}.md'
          if not notes.is_file() or not notes.read_text(encoding='utf-8').strip():
              raise SystemExit(f'Release notes are missing or empty: {notes}')
          manifest = json.loads(Path('site/downloads/artifact-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('adapter_version', version) != version:
              raise SystemExit('The preview contains separately versioned adapter candidates. Prepare a reviewed family release before tagging; do not replace the existing release.')
          expected = {
              f'artifacts/Clair-Chrome-{version}.zip',
              f'artifacts/Obscur-Chrome-{version}.zip',
              'equicord/Clair.theme.css',
              'equicord/Obscur.theme.css',
          }
          downloads = [item['path'] for item in manifest['downloads']]
          if manifest['version'] != version or len(downloads) != 4 or set(downloads) != expected:
              raise SystemExit('The build artifact does not contain the four downloads for this version')
          actual = {
              path.relative_to('site/downloads').as_posix()
              for pattern in ('artifacts/*.zip', 'equicord/*.theme.css')
              for path in Path('site/downloads').glob(pattern)
          }
          if actual != expected:
              raise SystemExit('The release file inventory differs from the four reviewed downloads')
          for relative in expected:
              if not (Path('site/downloads') / relative).is_file():
                  raise SystemExit(f'A release download is missing: {relative}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'RELEASE_NOTES={notes.as_posix()}\n')
      - name: Stage and verify the flat release downloads
        shell: bash
        run: |
          mkdir release
          cp site/downloads/artifacts/*.zip site/downloads/equicord/*.theme.css \
            site/downloads/artifact-manifest.json site/source.zip site/release-SHA256SUMS release/
          cd release
          sha256sum --check --strict release-SHA256SUMS
      - name: Upload the preview without replacing an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[].tag_name' > existing-release-tags.txt
          if grep -Fxq -- "$RELEASE_TAG" existing-release-tags.txt; then
            printf 'A release or draft already exists for %s. Inspect it before retrying.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "$RELEASE_TAG preview" --notes-file "$RELEASE_NOTES"

  pages:
    if: >-
      success() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_pages))
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clair-obscur-preview
          path: site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the checked preview
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Deploy the preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
