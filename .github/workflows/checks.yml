name: Theme checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and packaging checks
        run: python -m unittest discover -s tests -v
      - name: Build four theme artifacts
        run: python build.py
      - name: Verify reproducible output
        run: python build.py --check
      - name: Build static download specimen
        run: python preview.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Headless specimen checks
        run: npm run test:browser
        env:
          THEME_BROWSER_CHANNEL: chromium
